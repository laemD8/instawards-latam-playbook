<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instawards LATAM Playbook</title>
<meta name="description" content="Internal operating playbook for the Instawards LATAM program: monthly cycle, owners, timeline, calendar and workload.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Lora:ital,wght@0,400;0,500;1,500;1,600&amp;display=swap">
<style>
body{margin:0;background:#0F0F0F}
a{color:#FDDA24}a:hover{color:#F6F7F8}
.pg{font-family:Inter,system-ui,sans-serif;font-size:15.5px;line-height:1.55;color:#F6F7F8;background:#0F0F0F}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.serif{font-family:Lora,Georgia,serif}
.muted{color:rgba(246,247,248,.72)}
.kick{font-family:Lora,Georgia,serif;font-style:italic;font-weight:500;color:#B7ACE8;font-size:15px;margin:0 0 8px}
.sec{border-top:1px solid rgba(246,247,248,.13);padding:56px 0}
.h2{font-family:Lora,Georgia,serif;font-weight:400;font-size:36px;line-height:1.15;margin:0 0 12px}
.h3{font-family:Lora,Georgia,serif;font-weight:500;font-size:19px;line-height:1.3;margin:0 0 8px}
.cap{font-size:12.5px;color:rgba(246,247,248,.72)}
.tag{display:inline-block;font-size:12px;line-height:1.4;padding:2px 8px;border:1px solid rgba(246,247,248,.35);color:#F6F7F8;margin:0 6px 6px 0}
.tag-y{background:#FDDA24;border-color:#FDDA24;color:#0F0F0F;font-weight:600}
.tag-l{border-color:#B7ACE8;color:#B7ACE8}
.tag-s{border:1px dashed #D6D2C4;color:#D6D2C4}
.cell{border-top:1px solid rgba(246,247,248,.13);padding:18px 0}
ul.l{margin:0;padding-left:18px}ul.l li{margin:3px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:500;font-size:12.5px;color:rgba(246,247,248,.72);padding:10px 12px 10px 0;border-bottom:1px solid rgba(246,247,248,.3)}
.tbl td{padding:12px 12px 12px 0;border-bottom:1px solid rgba(246,247,248,.13);vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
details{border-top:1px solid rgba(246,247,248,.13)}
details:last-of-type{border-bottom:1px solid rgba(246,247,248,.13)}
summary{cursor:pointer;list-style:none;padding:16px 0;font-family:Lora,Georgia,serif;font-weight:500;font-size:18px;display:flex;justify-content:space-between;gap:16px;min-height:44px;box-sizing:border-box;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:Inter,sans-serif;color:#FDDA24;font-size:22px}
details[open] summary::after{content:"\2212"}
.dbody{padding:0 0 22px}
.btn{min-height:44px;min-width:44px;padding:0 14px;background:transparent;border:1px solid rgba(246,247,248,.35);color:#F6F7F8;font-size:14px;cursor:pointer;font-family:Inter,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:#FDDA24;color:#FDDA24}
.btn-y{background:#FDDA24;border-color:#FDDA24;color:#0F0F0F;font-weight:600}
.btn-y:hover{color:#0F0F0F;background:#F6F7F8;border-color:#F6F7F8}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid #FDDA24;outline-offset:2px}
.avw{display:inline-block;flex:none;border-radius:50%;overflow:hidden;line-height:0;vertical-align:middle}
.avw svg{display:block}
.av{width:26px;height:26px}
.av-sm{width:20px;height:20px}
.av-lg{width:72px;height:72px}
.avs{display:inline-flex;gap:3px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin:0 12px 6px 0}
.viewbar{position:sticky;top:0;z-index:20;background:rgba(15,15,15,.96);border-bottom:1px solid rgba(246,247,248,.13);backdrop-filter:blur(6px)}
.vb-btn{min-height:44px;padding:0 12px;background:transparent;border:1px solid transparent;color:#F6F7F8;font-family:Inter,sans-serif;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:border-color .2s,opacity .2s}
.vb-btn:hover{border-color:rgba(246,247,248,.35)}
.tl-row{display:grid;gap:3px 2px;min-height:46px;align-items:stretch;margin-top:4px}
.tl-item{grid-row:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:4px 6px;border:0;font-family:Inter,sans-serif;font-size:12.5px;cursor:pointer;overflow:hidden;transition:opacity .25s,transform .2s;text-align:left}
.tl-item:hover{transform:translateY(-1px)}
.tl-wide{justify-content:space-between}
.lane-label{font-family:Lora,Georgia,serif;font-style:italic;font-size:14px;margin:14px 0 2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-cell{min-height:92px;padding:6px;background:rgba(246,247,248,.04);font-size:12px;display:flex;flex-direction:column;gap:4px;box-sizing:border-box}
.ev{padding:4px 5px;font-size:11.5px;line-height:1.3;display:flex;flex-direction:column;gap:3px}
.tile{background:transparent;border:1px solid rgba(246,247,248,.13);padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:#F6F7F8;font-family:Lora,Georgia,serif;font-size:16px;transition:border-color .2s,opacity .25s}
.tile:hover{border-color:rgba(253,218,36,.6)}
.dotstep{width:28px;height:28px;padding:0;border-radius:50%;cursor:pointer;font-family:Inter,sans-serif;font-size:11px;transition:transform .2s}
.wbar{height:10px;transition:width .4s ease}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.8)}}
.halftone{background-image:radial-gradient(circle,#FDDA24 1.3px,transparent 1.6px);background-size:9px 9px;-webkit-mask-image:radial-gradient(circle at 38% 38%,#000 0%,rgba(0,0,0,.55) 38%,transparent 68%);mask-image:radial-gradient(circle at 38% 38%,#000 0%,rgba(0,0,0,.55) 38%,transparent 68%);border-radius:50%}
@media (max-width:720px){.h2{font-size:28px}.hero-h{font-size:38px !important}.hide-sm{display:none !important}.cal-cell{min-height:70px}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.tl-item,.wbar,.tile{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="pg" style="width: 100%; min-height: 100vh">

<header style="border-bottom: 1px solid #FDDA24">
<div class="wrap" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-top: 14px; padding-bottom: 14px">
<div class="serif" style="font-style: italic; font-weight: 600; font-size: 15px">BAF · Stellar Ambassador Program</div>
<div class="cap hide-sm">Instawards LATAM Operating Methodology</div>
<div class="cap">Internal playbook · monthly cycle</div>
</div>
</header>

<section>
<div class="wrap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; align-items: center; padding-top: 56px; padding-bottom: 44px">
<div>
<p class="kick">Internal operating playbook</p>
<h1 class="serif hero-h" style="font-weight: 400; font-size: 54px; line-height: 1.08; margin: 0 0 18px">Instawards LATAM operating methodology</h1>
<p class="muted" style="font-size: 16.5px; max-width: 560px; margin: 0">Who does what, and when. Pick a person in the bar below and the whole page follows their month: their moments on the timeline, their countries, their calendar blocks and their hours.</p>
</div>
<div class="hide-sm" style="display: flex; justify-content: center">
<div class="halftone" style="width: 300px; height: 300px" aria-hidden="true"></div>
</div>
</div>
<div class="wrap">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border-top: 1px solid rgba(246,247,248,.13)">
<div style="padding: 20px 16px 20px 0"><div class="serif" style="font-size: 40px; color: #FDDA24; line-height: 1.1">6</div><div class="cap">countries</div></div>
<div style="padding: 20px 16px 20px 0"><div class="serif" style="font-size: 40px; color: #FDDA24; line-height: 1.1">3</div><div class="cap">Instawards per country per month</div></div>
<div style="padding: 20px 16px 20px 0"><div class="serif" style="font-size: 40px; color: #FDDA24; line-height: 1.1">18</div><div class="cap">selected per cohort, at most</div></div>
<div style="padding: 20px 16px 20px 0"><div class="serif" style="font-size: 40px; color: #FDDA24; line-height: 1.1">30</div><div class="cap">day sprint per Instaward</div></div>
<div style="padding: 20px 16px 20px 0"><div class="serif" style="font-size: 40px; color: #FDDA24; line-height: 1.1">$5,000</div><div class="cap">maximum per Instaward</div></div>
</div>
</div>
</section>

<nav class="viewbar" aria-label="View as">
<div class="wrap scroll" style="display: flex; align-items: center; gap: 4px; padding-top: 6px; padding-bottom: 6px">
<span class="cap" style="white-space: nowrap; margin-right: 6px">View as</span>
<sc-for list="{{viewBtns}}" as="b" hint-placeholder-count="10">
<button type="button" class="vb-btn" style="border-color: {{b.bc}}; opacity: {{b.op}}" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}">
<sc-if value="{{b.hasAv}}" hint-placeholder-val="{{true}}">
<span class="avw av" aria-hidden="true"><svg viewBox="0 0 48 48" width="100%" height="100%"><rect width="48" height="48" fill="{{b.av.bg}}"></rect><path d="{{b.av.body}}" fill="{{b.av.color}}"></path><path d="{{b.av.dots}}" fill="{{b.av.ink}}"></path><path d="{{b.av.lines}}" fill="none" stroke="{{b.av.ink}}" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"></path></svg></span>
</sc-if>
<span>{{b.label}}</span>
</button>
</sc-for>
</div>
</nav>

<section class="sec" id="people" style="border-top: 0; padding-top: 40px">
<div class="wrap">
<sc-if value="{{isAll}}" hint-placeholder-val="{{true}}">
<p class="kick">The team</p>
<h2 class="h2">Every person has a character. Follow yours.</h2>
<p class="muted" style="max-width: 720px; margin: 0 0 20px">Select anyone to see their roles, their moments in the month and their estimated hours.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 0 28px">
<sc-for list="{{legend}}" as="p" hint-placeholder-count="9">
<button type="button" onClick="{{p.pick}}" style="display: flex; gap: 14px; align-items: center; text-align: left; background: transparent; border: 0; border-top: 1px solid rgba(246,247,248,.13); padding: 14px 0; color: #F6F7F8; cursor: pointer; font-family: Inter, sans-serif">
<span class="avw av-lg" style="width: 44px; height: 44px" aria-hidden="true"><svg viewBox="0 0 48 48" width="100%" height="100%"><rect width="48" height="48" fill="{{p.av.bg}}"></rect><path d="{{p.av.body}}" fill="{{p.av.color}}"></path><path d="{{p.av.dots}}" fill="{{p.av.ink}}"></path><path d="{{p.av.lines}}" fill="none" stroke="{{p.av.ink}}" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"></path></svg></span>
<span style="display: flex; flex-direction: column"><span class="serif" style="font-size: 18px; font-weight: 500">{{p.name}}</span><span class="cap">{{p.tagline}}</span></span>
</button>
</sc-for>
</div>
<p class="cap" style="margin: 16px 0 0">Marketing (Marian on Laura's side, Martín on Daniela's side) is part of the broader team but not a core reviewer in this workflow.</p>
</sc-if>
<sc-if value="{{notAll}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px; align-items: start">
<div style="display: flex; gap: 20px; align-items: flex-start">
<span class="avw av-lg" aria-hidden="true"><svg viewBox="0 0 48 48" width="100%" height="100%"><rect width="48" height="48" fill="{{me.av.bg}}"></rect><path d="{{me.av.body}}" fill="{{me.av.color}}"></path><path d="{{me.av.dots}}" fill="{{me.av.ink}}"></path><path d="{{me.av.lines}}" fill="none" stroke="{{me.av.ink}}" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"></path></svg></span>
<div>
<p class="kick" style="margin-bottom: 2px">Viewing as</p>
<h2 class="h2" style="margin-bottom: 8px">{{me.name}}</h2>
<div style="margin-bottom: 10px"><sc-for list="{{me.chips}}" as="c" hint-placeholder-count="2"><span class="tag">{{c.t}}</span></sc-for></div>
<ul class="l" style="font-size: 14.5px"><sc-for list="{{me.roles}}" as="r" hint-placeholder-count="4"><li>{{r.t}}</li></sc-for></ul>
</div>
</div>
<div style="border: 1px solid rgba(246,247,248,.13); padding: 22px">
<div class="cap">Estimated this month</div>
<div class="serif" style="font-size: 46px; color: #FDDA24; line-height: 1.1; margin: 4px 0 12px">{{me.hoursText}}</div>
<div class="cap" style="margin-bottom: 8px">Your moments in {{monthName}}</div>
<sc-for list="{{me.moments}}" as="m" hint-placeholder-count="4">
<a href="#timeline" onClick="{{m.pick}}" style="display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid rgba(246,247,248,.13); text-decoration: none; color: #F6F7F8; min-height: 28px">
<span>{{m.label}}</span><span class="cap">{{m.when}}</span>
</a>
</sc-for>
<button type="button" class="btn" style="margin-top: 14px" onClick="{{clearViewer}}">Back to everyone</button>
</div>
</div>
</sc-if>
</div>
</section>

<section class="sec" style="padding-top: 0; border-top: 0">
<div class="wrap">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); border: 1px solid rgba(246,247,248,.13)">
<div style="padding: 22px; background: #FDDA24; color: #0F0F0F">
<div style="font-size: 12.5px; font-weight: 600">Fixed calendar deadline</div>
<div class="serif" style="font-size: 42px; line-height: 1.1; margin: 6px 0">The 7th</div>
<div style="font-size: 14px">Applications close on the 7th of every month. It does not move for weekends or holidays. Review starts the next business day.</div>
</div>
<div style="padding: 22px; border-left: 1px solid rgba(246,247,248,.13)">
<div class="cap">System of record</div>
<div class="serif" style="font-size: 28px; line-height: 1.15; margin: 6px 0">Stellar Apex</div>
<div class="muted" style="font-size: 14px">If it is not in Apex, it is not recorded. Telegram is communication only.</div>
</div>
<div style="padding: 22px; border-left: 1px solid rgba(246,247,248,.13)">
<div class="cap">SLA is not allocated time</div>
<div class="serif" style="font-size: 28px; line-height: 1.15; margin: 6px 0">Hours scale with volume</div>
<div class="muted" style="font-size: 14px">Two business days is a deadline, not two full workdays.</div>
</div>
<div style="padding: 22px; border-left: 1px solid rgba(246,247,248,.13)">
<div class="cap">Human review is mandatory</div>
<div class="serif" style="font-size: 28px; line-height: 1.15; margin: 6px 0">AI supports, people decide</div>
<div class="muted" style="font-size: 14px">AI can summarize, compare, organize and flag gaps. Reviewers own the judgment.</div>
</div>
</div>
</div>
</section>

<section class="sec" id="timeline">
<div class="wrap">
<p class="kick">The month at a glance</p>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 8px">
<h2 class="h2" style="margin: 0">Two cycles, one month</h2>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" class="btn" aria-label="Previous month" onClick="{{prevMonth}}">‹</button>
<div class="serif" style="font-size: 20px; min-width: 150px; text-align: center">{{monthName}}</div>
<button type="button" class="btn" aria-label="Next month" onClick="{{nextMonth}}">›</button>
</div>
</div>
<p style="margin: 0 0 20px"><span class="tag tag-y" style="margin-bottom: 0">{{todayTag}}</span> <span class="muted">{{nowText}}</span></p>
<div class="scroll">
<div style="min-width: 980px">
<div class="tl-row" style="grid-template-columns: repeat({{days}}, minmax(0, 1fr)); min-height: 0">
<sc-for list="{{weekBands}}" as="w" hint-placeholder-count="4">
<div class="cap" style="grid-row: 1; grid-column: {{w.col}}; border-bottom: 1px solid rgba(246,247,248,.3); padding: 4px 6px">{{w.label}}</div>
</sc-for>
</div>
<div class="tl-row" style="grid-template-columns: repeat({{days}}, minmax(0, 1fr)); min-height: 0">
<sc-for list="{{dayHeads}}" as="d" hint-placeholder-count="30">
<div style="grid-row: 1; text-align: center; font-size: 11px; line-height: 1.25; padding: 4px 0; background: {{d.bg}}; color: {{d.fg}}; font-weight: {{d.fw}}"><div>{{d.wd}}</div><div>{{d.n}}</div></div>
</sc-for>
</div>
<div class="lane-label" style="color: #FDDA24">Selection · next cohort</div>
<div class="tl-row" style="grid-template-columns: repeat({{days}}, minmax(0, 1fr))">
<sc-for list="{{selA}}" as="m" hint-placeholder-count="3">
<button type="button" class="tl-item tl-wide" style="grid-column: {{m.col}}; opacity: {{m.op}}; background: {{m.bg}}; color: {{m.fg}}; border-top: {{m.bt}}; outline: {{m.ol}}; outline-offset: -2px" aria-label="{{m.aria}}" onClick="{{m.pick}}">
<span style="font-weight: 500">{{m.text}}</span>
<span class="avs"><sc-for list="{{m.av}}" as="p" hint-placeholder-count="2"><span class="avw av-sm" aria-hidden="true"><svg viewBox="0 0 48 48" width="100%" height="100%"><rect width="48" height="48" fill="{{p.bg}}"></rect><path d="{{p.body}}" fill="{{p.color}}"></path><path d="{{p.dots}}" fill="{{p.ink}}"></path><path d="{{p.lines}}" fill="none" stroke="{{p.ink}}" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"></path></svg></span></sc-for></span>
</button>
</sc-for>
</div>
<div class="tl-row" style="grid-template-columns: repeat({{days}}, minmax(0, 1fr))">
<sc-for list="{{selB}}" as="m" hint-placeholder-count="6">
<button type="button" class="tl-item" style="grid-column: {{m.col}}; opacity: {{m.op}}; background: {{m.bg}}; color: {{m.fg}}; border-top: {{m.bt}}; outline: {{m.ol}}; outline-offset: -2px; padding: 0; font-weight: 600; font-size: 14px" aria-label="{{m.aria}}" onClick="{{m.pick}}">{{m.text}}</button>
</sc-for>
</div>
<div class="lane-label" style="color: #B7ACE8">Monitoring · active cohort, 30-day sprint</div>
<div class="tl-row" style="grid-template-columns: repeat({{days}}, minmax(0, 1fr))">
<sc-for list="{{monA}}" as="m" hint-placeholder-count="4">
<button type="button" class="tl-item tl-wide" style="grid-column: {{m.col}}; opacity: {{m.op}}; background: {{m.bg}}; color: {{m.fg}}; border-top: {{m.bt}}; outline: {{m.ol}}; outline-offset: -2px" aria-label="{{m.aria}}" onClick="{{m.pick}}">
<span style="font-weight: 500">{{m.text}}</span>
<span class="avs"><sc-for list="{{m.av}}" as="p" hint-placeholder-count="2"><span class="avw av-sm" aria-hidden="true"><svg viewBox="0 0 48 48" width="100%" height="100%"><rect width="48" height="48" fill="{{p.bg}}"></rect><path d="{{p.body}}" fill="{{p.color}}"></path><path d="{{p.dots}}" fill="{{p.ink}}"></path><path d="{{p.lines}}" fill="none" stroke="{{p.ink}}" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"></path></svg></span></sc-for></span>
</button>
</sc-for>
</div>
<div class="tl-row" style="grid-template-columns: repeat({{days}}, minmax(0, 1fr))">
<sc-for list="{{monB}}" as="m" hint-placeholder-count="2">
<button type="button" class="tl-item tl-wide" style="grid-column: {{m.col}}; opacity: {{m.op}}; background: {{m.bg}}; color: {{m.fg}}; border-top: {{m.bt}}; outline: {{m.ol}}; outline-offset: -2px" aria-label="{{m.aria}}" onClick="{{m.pick}}">
<span style="font-weight: 500">{{m.text}}</span>
<span class="avs"><sc-for list="{{m.av}}" as="p" hint-placeholder-count="6"><span class="avw av-sm" aria-hidden="true"><svg viewBox="0 0 48 48" width="100%" height="100%"><rect width="48" height="48" fill="{{p.bg}}"></rect><path d="{{p.body}}" fill="{{p.color}}"></path><path d="{{p.dots}}" fill="{{p.ink}}"></path><path d="{{p.lines}}" fill="none" stroke="{{p.ink}}" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"></path></svg></span></sc-for></span>
</button>
</sc-for>
</div>
</div>
</div>
<p class="cap" style="margin: 10px 0 0">Business days 1 to 5 shown as 1–5 after the 7th. Holidays are not included. Reviews happen twice per month, Week 2 and Week 4. Tap any block for details.</p>

<div style="margin-top: 22px; border: 1px solid rgba(246,247,248,.13); padding: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px">
<div>
<span class="tag" style="border-color: {{detail.color}}; color: {{detail.color}}">{{detail.lane}}</span>
<div class="serif" style="font-size: 28px; line-height: 1.15; margin: 6px 0 4px">{{detail.label}}</div>
<div class="cap" style="margin-bottom: 14px">{{detail.when}}</div>
<div>
<sc-for list="{{detail.people}}" as="p" hint-placeholder-count="3">
<span class="chip"><span class="avw av" aria-hidden="true"><svg viewBox="0 0 48 48" width="100%" height="100%"><rect width="48" height="48" fill="{{p.bg}}"></rect><path d="{{p.body}}" fill="{{p.color}}"></path><path d="{{p.dots}}" fill="{{p.ink}}"></path><path d="{{p.lines}}" fill="none" stroke="{{p.ink}}" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"></path></svg></span>{{p.name}}</span>
</sc-for>
<sc-for list="{{detail.chips}}" as="c" hint-placeholder-count="1"><span class="tag">{{c.t}}</span></sc-for>
</div>
<div class="serif" style="font-size: 20px; color: #FDDA24; margin-top: 10px">{{detail.hours}}</div>
</div>

</div>
</div>
</div>
</section>

<section class="sec" id="review">
<div class="wrap">
<p class="kick">Application review workflow</p>
<h2 class="h2">From the 7th to a final decision in five business days</h2>
<p class="muted" style="max-width: 720px; margin: 0 0 28px">Daniela (product and business) and Gerardo (technical) assess every eligible application independently before they meet. In {{monthName}}: business days 1–5 are {{bdRange}}.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 28px; opacity: {{dgOp}}">
<div class="cell">
<span class="tag tag-y">BD 1–2 · {{bd12}}</span>
<div class="h3" style="margin-top: 6px">Asynchronous review</div>
<ul class="l" style="font-size: 14.5px">
<li>Full application and SOW</li>
<li>Standardized rubric</li>
<li>Feasibility within 30 days</li>
<li>Scope, deliverables, planned evidence</li>
<li>Written feedback, missing information</li>
<li><strong>Top 5 per country</strong> from each reviewer</li>
</ul>
</div>
<div class="cell">
<span class="tag">BD 3 · {{bd3}} · up to 3 h</span>
<div class="h3" style="margin-top: 6px">Consensus meeting</div>
<p style="font-size: 14.5px; margin: 0 0 8px">Each reviewer brings Top 5, rubric scores, strengths, risks and open questions. About 30 minutes per country.</p>
<p style="font-size: 14.5px; margin: 0">Outcome: <strong style="color: #FDDA24">3 selected projects per country</strong>.</p>
</div>
<div class="cell">
<span class="tag tag-s">BD 4 · {{bd4}} · 1 h hold</span>
<div class="h3" style="margin-top: 6px">Contingency</div>
<p style="font-size: 14.5px; margin: 0 0 8px">Only if consensus was not reached, more information is needed, a project needs a second review, or a scoring gap remains.</p>
<p class="cap" style="margin: 0">Release the block if it is not needed.</p>
</div>
<div class="cell">
<span class="tag tag-y">BD 5 · {{bd5}} · deadline</span>
<div class="h3" style="margin-top: 6px">Decision in Apex</div>
<ul class="l" style="font-size: 14.5px">
<li><strong>Accepted:</strong> moved to the stage visible to Shaun / Stellar</li>
<li><strong>Rejected:</strong> feedback through the rubric / platform</li>
<li><strong>Additional information required:</strong> only if the process explicitly allows it before final closure</li>
</ul>
</div>
</div>
<div style="margin-top: 36px">
<div class="h3">Upcoming rounds</div>
<p class="cap" style="margin: 0 0 14px">Exact dates for the next four cohorts. Tap a month to load it in the timeline and calendar. Holidays are not included.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<sc-for list="{{rounds}}" as="r" hint-placeholder-count="4">
<button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="text-align: left; background: {{r.bg}}; border: 1px solid {{r.bc}}; padding: 18px; color: #F6F7F8; cursor: pointer; font-family: Inter, sans-serif; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span class="serif" style="font-size: 22px">{{r.month}}</span><span class="cap">{{r.tag}}</span></div>
<div style="background: #FDDA24; color: #0F0F0F; font-weight: 600; font-size: 13px; padding: 6px 8px; margin: 10px 0 6px">Applications close · {{r.close}}</div>
<sc-for list="{{r.rows}}" as="x" hint-placeholder-count="8">
<div style="display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 6px 0; border-top: 1px solid rgba(246,247,248,.13)"><span class="cap">{{x.k}}</span><span style="text-align: right; color: {{x.c}}">{{x.v}}</span></div>
</sc-for>
</button>
</sc-for>
</div>
</div>
<div style="margin-top: 28px">
<details>
<summary>What reviewers look at: first Instaward vs follow-on</summary>
<div class="dbody" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px">
<div>
<div class="h3">First Instaward</div>
<p class="cap" style="margin: 0 0 8px">The team is applying for the first time.</p>
<ul class="l" style="font-size: 14.5px"><li>Project clarity</li><li>Scope</li><li>Feasibility</li><li>Deliverables</li><li>Evidence plan</li><li>Technical and product relevance</li></ul>
</div>
<div>
<div class="h3">Follow-on Instaward</div>
<p class="cap" style="margin: 0 0 8px">The project already completed a previous Instaward. Review also includes:</p>
<ul class="l" style="font-size: 14.5px"><li>Previous commitments</li><li>Completion history</li><li>Evidence from the prior sprint</li><li>Quality of execution</li><li>Responsiveness to previous feedback</li><li>Justification for continued funding</li></ul>
</div>
</div>
</details>
<details>
<summary>Rubric ownership and feedback</summary>
<div class="dbody">
<p style="margin: 0 0 8px"><strong>Adriana</strong> prepares and maintains the review rubric. It must include a dedicated feedback field.</p>
<p class="muted" style="margin: 0">Every reviewed team should receive useful feedback, including teams that are not selected, so they can improve a future application.</p>
</div>
</details>
</div>
</div>
</section>

</div>
</section>

<section class="sec" id="monitoring">

<p class="muted" style="max-width: 760px; margin: 0 0 24px">Every review compares <span style="color: #F6F7F8">SOW commitment → Planned work → Expected output → Evidence → Status</span>. Reviews validate execution, they do not ask for generic progress updates.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 28px">

<span class="tag tag-l">Every week</span>

<p class="cap" style="margin: 0 0 8px">Nicolle: CO / MX / CR · Adriana: AR / BO / PE</p>
<ul class="l" style="font-size: 14.5px"><li>Weekly update was submitted</li><li>Required evidence is attached</li><li>Links work</li><li>Deliverable status is clear</li><li>Blockers are documented</li><li>Missing information is followed up</li></ul>
</div>
<div class="cell">
<span class="tag tag-l">Week 2</span>
<div class="h3" style="margin-top: 6px">Review 1: Mid-Sprint Review</div>
<ul class="l" style="font-size: 14.5px"><li>Commitments vs actual progress</li><li>Weeks 1–2 outputs and evidence</li><li>Delays, blockers, scope deviation</li><li>Feedback and corrective actions for the second half</li></ul>
</div>
<div class="cell">
<span class="tag tag-l">Week 4</span>
<div class="h3" style="margin-top: 6px">Review 2: Final Review</div>

</div>

<p class="kick">Workload, live</p>

<section class="sec" id="systems">
<div class="wrap">
<p class="kick">Systems and artifacts</p>
<h2 class="h2">Where things live</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 28px; margin-top: 12px">
<div class="cell">
<span class="tag tag-y">System of record</span>
<div class="h3" style="margin-top: 6px">Stellar Apex</div>
<p class="muted" style="font-size: 14.5px; margin: 0">Applications, review status, feedback, selection, progress, evidence, monitoring and stage transitions. If it is not in Apex, it is not recorded.</p>
</div>
<div class="cell">
<span class="tag">Communication only</span>
<div class="h3" style="margin-top: 6px">Telegram, one group per project</div>
<p class="muted" style="font-size: 14.5px; margin: 0">Quick questions, coordination, blockers, reminders and meeting logistics. Progress or evidence shared only here does not count as recorded evidence.</p>
</div>
<div class="cell">
<span class="tag">Stellar handoff artifact</span>
<div class="h3" style="margin-top: 6px">Monthly handoff deck</div>
<p class="muted" style="font-size: 14.5px; margin: 0">Standardized and organized by country, so Shaun can process the cohort without reconstructing each application.</p>
</div>
</div>
<div style="margin-top: 28px">
<details>
<summary>Week 3 handoff: Daniela's checklist and deck structure</summary>
<div class="dbody" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px">
<div>
<div class="h3">Handoff owner: Daniela</div>
<ul class="l" style="font-size: 14.5px"><li>Confirm selected projects are correctly staged in Apex</li><li>Verify project information is complete</li><li>Notify Shaun on Telegram that the cohort is ready</li><li>Prepare the monthly handoff deck</li><li>Lead the monthly handoff meeting in the third week</li><li>Capture follow-up actions after the meeting</li></ul>
</div>
<div>
<div class="h3">Per project in the deck</div>
<p style="font-size: 14.5px; margin: 0">Country · Project name · Team · Instaward stage · First or follow-on · What it is building · Problem addressed · 30-day objective · Key deliverables · Requested amount · Why BAF recommends it · Technical notes · Product notes · Previous Instaward performance, when applicable · Risks or considerations · Apex link</p>
</div>
</div>
</details>
<details>
<summary>Instaward structure and SOW constraints</summary>
<div class="dbody" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px">
<div>
<div class="h3">Each 30-day scoped engagement defines</div>
<ul class="l" style="font-size: 14.5px"><li>Problem being addressed</li><li>Objective for the 30-day sprint</li><li>In-scope deliverables and explicit out-of-scope items</li><li>Requested budget</li><li>Weekly execution plan and expected weekly outputs</li><li>Planned evidence of completion</li><li>Next-step alignment after completion</li></ul>
</div>
<div>
<div class="h3">Current constraints</div>
<table class="tbl">
<tbody>
<tr><td>Maximum per Instaward</td><td class="num">$5,000</td></tr>
<tr><td>Follow-on Instawards</td><td class="num">Two at most</td></tr>
<tr><td>Cumulative Instawards funding</td><td class="num">$15,000 max</td></tr>
<tr><td>Scope completion</td><td class="num">30 days or less</td></tr>
</tbody>
</table>
</div>
</div>
</details>
<details>
<summary>Fernanda coordination layer</summary>
<div class="dbody">
<p class="muted" style="margin: 0 0 12px">Fernanda can act as an additional coordination layer across Chapter Leads outside Mexico, to reduce direct-management load at Co-President level while keeping assistants informed.</p>
<table class="tbl">
<thead><tr><th>When Fernanda meets with</th><th>Include</th><th>Data continuity and Apex completeness</th></tr></thead>
<tbody>
<tr><td>Eduardo (Peru)</td><td>Adriana</td><td>Adriana</td></tr>
<tr><td>Emilia (Bolivia)</td><td>Adriana</td><td>Adriana</td></tr>
<tr><td>Future Costa Rica owner</td><td>Nicolle</td><td>Nicolle</td></tr>
</tbody>
</table>
</div>
</details>
<details>
<summary>Success criteria</summary>
<div class="dbody">
<ul class="l" style="font-size: 14.5px; columns: 2 280px; column-gap: 40px">
<li>Every country has a predictable monthly sourcing rhythm</li><li>Applications always close on the 7th</li><li>Review starts on the next business day</li><li>Daniela and Gerardo complete review within the SLA</li><li>All teams receive documented feedback</li><li>Selected projects are correctly handed off in Apex</li><li>Shaun receives a structured monthly cohort presentation</li><li>Every active project submits weekly updates</li><li>Missing evidence is found before formal reviews</li><li>Mid-sprint reviews identify problems early</li><li>Final reviews rest on evidence, not perception</li><li>Project history is reusable for follow-on decisions</li><li>Workload can be forecast from volume</li><li>No task depends on informal memory</li>
</ul>
</div>
</details>
</div>
</div>
